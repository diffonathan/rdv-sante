name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une seule exécution par branche : un push qui suit de près annule le
# précédent au lieu de faire la queue derrière lui.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Service ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Un service qui casse ne doit pas masquer l'état de l'autre.
      fail-fast: false
      matrix:
        service: [rendezvous, notifications, patients, gateway, demo]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Met en cache ~/.m2 en se fiant aux pom.xml : sans lui, chaque
          # exécution retélécharge tout l'arbre Spring Boot.
          cache: maven

      - name: Compilation et tests
        working-directory: services
        # Lancé depuis l'agrégateur avec `-am` : le module construit ET ce
        # dont il dépend. La passerelle a besoin du module `documentation`,
        # et `demo` des trois services. Sans `-am`, la construction échoue sur
        # une dépendance absente du dépôt local.
        #
        # verify enchaîne Surefire (unitaires) puis Failsafe (intégration).
        # `test` seul ne lancerait PAS les tests d'intégration, qui sont
        # l'essentiel de ce qui est vérifié ici.
        #
        # Les tests d'intégration démarrent PostgreSQL et Kafka via
        # Testcontainers — le démon Docker est présent sur les exécuteurs
        # ubuntu-latest, rien à installer.
        run: ./mvnw -B --no-transfer-progress verify -pl ${{ matrix.service }} -am

      - name: Rapports de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/*-reports/
          if-no-files-found: ignore

  front:
    name: Front Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci et non npm install : l'exécution respecte le lockfile au lieu
      # de le réécrire, donc la CI construit ce que la machine construit.
      - name: Dépendances
        working-directory: web
        run: npm ci

      - name: Construction
        working-directory: web
        run: npx ng build

  image:
    name: Image de démonstration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On construit sans pousser : le but est d'attraper une image qui ne se
      # construit plus, pas de publier. Un Dockerfile cassé se découvre sinon
      # au moment du déploiement, c'est-à-dire au pire moment.
      - name: Construction de l'image
        run: docker build -t rdv-sante-demo:ci .
