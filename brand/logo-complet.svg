<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 64" width="248" height="64"
     role="img" aria-label="RDV Santé">
  <title>RDV Santé — logo complet</title>
  <desc>Le symbole et le nom, pour les en-têtes et les documents.</desc>

  <defs>
    <linearGradient id="fondC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C88A"/>
      <stop offset="1" stop-color="#068A5C"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#fondC)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#F9A825" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="104.7 125.66"
          transform="rotate(-120 32 32)"/>
  <g fill="#FFFFFF">
    <rect x="21" y="29" width="22" height="6" rx="3"/>
    <rect x="29" y="21" width="6" height="22" rx="3"/>
  </g>

  <!-- Le nom en texte et non en tracés : ce fichier sert au web, où la
       police est chargée. Pour l'impression ou un support sans DM Sans,
       utiliser logo.svg seul, qui ne dépend d'aucune police. -->
  <text x="80" y="41" font-family="DM Sans, Segoe UI, system-ui, sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.6" fill="#101014">RDV<tspan
        fill="#068A5C"> Santé</tspan></text>
</svg>
