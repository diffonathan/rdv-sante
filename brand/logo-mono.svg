<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="RDV Santé">
  <title>RDV Santé — version monochrome</title>
  <desc>Pour les fonds colorés, la gravure, le tampon et le fax. Une seule couleur : currentColor.</desc>

  <!-- Pas de fond : la forme se découpe sur le support. « currentColor » la
       fait hériter de la couleur du texte environnant — un seul fichier
       suffit pour le noir, le blanc et n'importe quelle teinte. -->
  <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
    <circle cx="32" cy="32" r="20" stroke-dasharray="104.7 125.66"
            transform="rotate(-120 32 32)"/>
  </g>
  <g fill="currentColor">
    <rect x="21" y="29" width="22" height="6" rx="3"/>
    <rect x="29" y="21" width="6" height="22" rx="3"/>
  </g>
</svg>
