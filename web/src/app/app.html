<header class="bandeau">
  <div class="bandeau-contenu">
    <a class="marque" routerLink="/" aria-label="RDV Santé, accueil">
      <svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true">
        <defs>
          <linearGradient id="marque-fond" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#00C88A" />
            <stop offset="1" stop-color="#068A5C" />
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="15" fill="url(#marque-fond)" />
        <circle
          cx="32" cy="32" r="20" fill="none" stroke="#F9A825" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="104.7 125.66"
          transform="rotate(-120 32 32)"
        />
        <rect x="21" y="29" width="22" height="6" rx="3" fill="#fff" />
        <rect x="29" y="21" width="6" height="22" rx="3" fill="#fff" />
      </svg>
      RDV Santé
    </a>

    <nav>
      <a routerLink="/" routerLinkActive="actif" [routerLinkActiveOptions]="{ exact: true }">
        Prendre rendez-vous
      </a>
      <a routerLink="/secretariat" routerLinkActive="actif">Secrétariat</a>
      <a routerLink="/salle-attente" routerLinkActive="actif">Salle d’attente</a>
      <a routerLink="/technique" routerLinkActive="actif">Sous le capot</a>
    </nav>

    <button class="discret bouton-aide" (click)="ouvrirAide()">Aide</button>
  </div>
</header>

<main>
  <router-outlet />
</main>
